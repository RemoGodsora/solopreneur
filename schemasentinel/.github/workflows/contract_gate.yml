name: SchemaSentinel Contract Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SchemaSentinel Regression Suite
        run: |
          pytest -v

      - name: Enforce Production Contracts via CLI
        run: |
          python cli/main.py test --contract contracts/orders_v1.yaml --data data/orders_clean.csv --strict